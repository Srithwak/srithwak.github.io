name: Format Code

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    format:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # Token needed to push changes back
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Run Prettier
              run: |
                  npx prettier --write "**/*.{html,css,js,json,md}"

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "style: auto-format code with Prettier"
                  branch: ${{ github.head_ref }}
