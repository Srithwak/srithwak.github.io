<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rithwak Somepalli — Software Engineer</title>
  <meta name="description" content="Portfolio of Rithwak Somepalli, a Software Engineer specializing in cloud infrastructure, machine learning, and full-stack development." />
  <meta name="author" content="Rithwak Somepalli" />
  <meta property="og:title" content="Rithwak Somepalli — Software Engineer" />
  <meta property="og:description" content="Portfolio of Rithwak Somepalli, a Software Engineer specializing in cloud infrastructure, machine learning, and full-stack development." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css?v=2.0.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D91B24'><path d='M13 10V3L4 14h7v7l9-11h-7z'/></svg>" />
</head>
<body>
  <!-- Scroll Progress -->
  <div class="scroll-progress" id="scroll-progress"></div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loader-content">
      <div class="loader-name">
        <span class="loader-name-word" data-text="Rithwak">Rithwak</span>
        <span class="loader-name-word" data-text="Somepalli">Somepalli</span>
      </div>
      <div class="loader-line"><div class="loader-line-fill"></div></div>
    </div>
  </div>

  <!-- Cursor Glow -->
  <div class="cursor-glow" id="cursor-glow"></div>

  <!-- ===== NAVIGATION ===== -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a class="nav-logo" href="#hero" id="nav-logo">Rithwak Somepalli</a>
      <div class="nav-actions">
        <div class="nav-links" id="nav-links">
          <a href="#experience">Experience</a>
          <a href="#projects">Projects</a>
          <a href="#about">About</a>
          <a href="#contact" class="nav-cta magnetic">
            <span class="cta-icon">✦</span> Contact
          </a>
        </div>
        <button class="theme-toggle magnetic" id="theme-toggle" aria-label="Toggle dark/light mode">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== HERO / INTRO ===== -->
  <section class="section" id="hero">
    <div class="container">
      <div class="hero-content">
        <p class="hero-greeting" id="hero-greeting">
          <!-- Populated by JS from intro.json -->
        </p>
        <h1 class="hero-headline" id="hero-headline">
          <!-- Populated by JS from intro.json -->
        </h1>
        <p class="hero-tagline" id="hero-tagline">
          <!-- Populated by JS from intro.json -->
        </p>
        <div class="hero-actions" style="margin-top: 32px;">
          <a href="RS_resume.pdf" target="_blank" class="nav-cta magnetic" download>
            <span class="cta-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </span> Download Resume
          </a>
        </div>
      </div>
    </div>
  </section>

  <div class="section-divider"></div>

  <!-- ===== EXPERIENCE ===== -->
  <section class="section" id="experience">
    <div class="container">
      <div class="section-header reveal-left">
        <span class="section-label">Career</span>
        <h2 class="section-title">Experience</h2>
      </div>
      <div id="experience-list">
        <!-- Populated by JS from experience.json -->
      </div>
    </div>
  </section>

  <div class="section-divider"></div>

  <!-- ===== PROJECTS ===== -->
  <section class="section" id="projects">
    <div class="container">
      <div class="section-header reveal-left">
        <span class="section-label">Work</span>
        <h2 class="section-title">Some works I'm proud of</h2>
        <p class="section-subtitle">super proud of...</p>
      </div>
      <div class="projects-grid" id="projects-grid">
        <!-- Populated by JS from projects.json -->
      </div>
    </div>
  </section>

  <div class="section-divider"></div>

  <!-- ===== ABOUT ===== -->
  <section class="section" id="about">
    <div class="container">
      <div class="section-header reveal-left">
        <span class="section-label">Who I Am</span>
        <h2 class="section-title">Rithwak is all about...</h2>
      </div>
      <div class="about-grid" id="about-grid">
        <!-- Populated by JS from about.json -->
      </div>

      <!-- Skills Marquee -->
      <div class="skills-marquee-container reveal">
        <div class="skills-marquee" id="skills-marquee">
          <!-- Populated by JS from config.json skills -->
        </div>
      </div>
    </div>
  </section>

  <div class="section-divider"></div>

  <!-- ===== CONTACT ===== -->
  <section class="section" id="contact">
    <div class="container">
      <div class="contact-content">
        <div class="contact-left reveal">
          <h2 class="section-title">Contact Me</h2>
          <a class="contact-email magnetic" id="contact-email" href="mailto:srithwak@gmail.com">srithwak@gmail.com</a>
        </div>
        <div class="contact-social reveal reveal-delay-2" id="contact-social">
          <!-- Populated by JS -->
        </div>
      </div>
      <div class="footer-copyright" id="footer-copyright">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <script src="script.js?v=2.0.0"></script>
</body>
</html>
