  <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rithwak Somepalli — Portfolio</title>
  <meta name="description" content="AI/ML and Full-Stack Developer Portfolio" />
  <meta name="author" content="Rithwak Somepalli" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="scroll-progress"></div>
  <div id="cursor"></div>
  <div id="cursor-follower"></div>
  <canvas id="canvas-bg"></canvas>
  <!-- Navigation -->
  <header class="site-header">
    <nav class="container nav">
      <a href="#" class="brand">
        <span class="brand-mark">RS</span>
        <span class="brand-name">Rithwak</span>
      </a>

      <div class="nav-right">
        <ul class="nav-links" id="navLinks">
          <li><a href="#experience">Experience</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>

        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark/Light Mode">
          <!-- Icon injected via JS -->
        </button>

        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
      </div>
    </nav>
  </header>

  <main>
    <!-- Hero Section -->
    <section class="hero active" id="home"> <!-- Added active class for immediate visibility -->
      <div class="container hero-inner">
        <div class="hero-copy">
          <h1 id="heroName">Loading...</h1>
          <p class="subtitle" id="heroTitle">...</p>
          <p class="muted" id="heroLocation">...</p>

          <div class="hero-actions">
            <a class="btn btn-primary" href="#projects">View Projects</a>
            <a class="btn btn-ghost" id="resumeBtn" href="#" target="_blank">Download Resume</a>
          </div>

          <div class="quick-links" style="margin-top: 2rem;">
            <a id="githubLink" href="#" target="_blank" style="margin-right: 1rem;">GitHub</a>
            <a id="linkedinLink" href="#" target="_blank">LinkedIn</a>
          </div>
        </div>

        <div class="hero-card">
          <div class="hero-summary" id="heroSummary">
            <!-- Injected via JS -->
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Experience Section -->
    <section id="experience">
      <div class="container">
        <h2>Experience</h2>
        <div class="card-grid" id="experienceContainer">
          <!-- Skeletons for loading state -->
          <div class="card skeleton-card skeleton"></div>
          <div class="card skeleton-card skeleton"></div>
        </div>
      </div>
    </section>

    <!-- Projects Section -->
    <section id="projects">
      <div class="container">
        <h2>Projects</h2>
        <div class="card-grid" id="projectsContainer">
          <div class="card skeleton-card skeleton"></div>
          <div class="card skeleton-card skeleton"></div>
          <div class="card skeleton-card skeleton"></div>
        </div>
      </div>
    </section>

    <!-- Skills Section -->
    <section id="skills">
      <div class="container">
        <h2>Technical Skills</h2>
        <div class="pill-grid" id="skillsContainer">
          <div class="skeleton" style="width: 100px; height: 40px; border-radius: 50px;"></div>
          <div class="skeleton" style="width: 120px; height: 40px; border-radius: 50px;"></div>
          <div class="skeleton" style="width: 80px; height: 40px; border-radius: 50px;"></div>
        </div>
      </div>
    </section>

    <!-- Certifications Section -->
    <section id="certifications">
      <div class="container">
        <h2>Certifications</h2>
        <div class="card-grid" id="certsContainer">
          <div class="card skeleton-card skeleton"></div>
        </div>
      </div>
    </section>

    <!-- Education Section -->
    <section id="education">
      <div class="container">
        <h2>Education</h2>
        <div class="card-grid" id="educationContainer">
          <div class="card skeleton-card skeleton"></div>
        </div>
      </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
      <div class="container">
        <h2>Get in Touch</h2>
        <div class="contact-grid" id="contactContainer">
          <div class="contact-card skeleton-card skeleton"></div>
          <div class="contact-card skeleton-card skeleton"></div>
        </div>
      </div>
    </section>
  </main>

  <button id="backToTop" class="back-to-top" aria-label="Back to Top">↑</button>

  <footer class="site-footer">
    <div class="container">
      <p class="muted">© <span id="year"></span> Rithwak Somepalli. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
